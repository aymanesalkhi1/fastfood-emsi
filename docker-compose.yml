name: fastfood

x-spark: &spark
  image: fastfood-spark:3.5.3
  build: .
  volumes:
    - ./:/work
  environment: &spark-env
    PYTHONPATH: /work/src:/work/third_party
    PYSPARK_PYTHON: /opt/venv/bin/python
    PYSPARK_DRIVER_PYTHON: /opt/venv/bin/python
    SPARK_JARS_PRELOADED: "1"

services:
  kafka:
    image: apache/kafka:3.7.1
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./scripts/kafka-init.sh:/kafka-init.sh:ro
    restart: "no"

  minio:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    restart: "no"

  spark-master:
    <<: *spark
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-1
      - --cores
      - "2"
      - --memory
      - 1G
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "8081:8081"
    depends_on:
      spark-master:
        condition: service_healthy

  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - spark-worker-2
      - --cores
      - "2"
      - --memory
      - 1G
      - --webui-port
      - "8082"
      - spark://spark-master:7077
    ports:
      - "8082:8082"
    depends_on:
      spark-master:
        condition: service_healthy

  jupyter:
    <<: *spark
    hostname: jupyter
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=fastfood
      - --ServerApp.root_dir=/work
    environment:
      <<: *spark-env
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: jupyter
      SPARK_UI_ENABLED: "true"
      SPARK_UI_PORT: "4040"
      SPARK_DRIVER_MEMORY: 1536m
      PYSPARK_SUBMIT_ARGS: "--driver-memory 1536m pyspark-shell"
      LAKE_URI: s3a://lake
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      ORDERS_HISTORY: s3a://lake/bronze/history/orders_history.jsonl
      RESTAURANTS_PATH: s3a://lake/bronze/history/restaurants.json
      HOME: /tmp
    ports:
      - "8888:8888"
      - "4040:4040"
    depends_on:
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  mc:
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    profiles: ["tools"]
    entrypoint: ["mc"]
    volumes:
      - ./data:/data:ro

volumes:
  kafka-data:
  minio-data:
